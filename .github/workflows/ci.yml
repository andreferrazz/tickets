# Everything a reviewer would otherwise run by hand, on every pull request and
# on main. Its one job, `verify`, is a required check in the main ruleset.
# Actions and images are pinned by commit and digest, like every dependency.
name: CI

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-24.04
        services:
            postgres:
                image: postgres:18.6@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
                env:
                    POSTGRES_PASSWORD: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        env:
            # The e2e harness reads these to find Postgres (e2e/support/database.ts).
            PGHOST: localhost
            PGPORT: '5432'
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  # The Node the production image runs (Dockerfile).
                  node-version: 24.22.2
                  cache: npm
            - name: Install dependencies
              run: npm ci
            - name: Type check
              run: npm run check
            - name: Formatting
              run: npx prettier --check .
            - name: Production build
              run: npm run build
            - name: Install the browser the suite uses
              run: npx playwright install --with-deps chromium
            - name: End-to-end suite
              run: npm test
            - name: Keep the report of a failed run
              if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 7
